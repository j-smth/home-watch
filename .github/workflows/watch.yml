name: Home watch

on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 min (GitHub may delay runs by 5–20 min)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check hazards and send alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          PTREE_USER: ${{ secrets.PTREE_USER }}
          PTREE_PASS: ${{ secrets.PTREE_PASS }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: node scripts/run.mjs
      - name: Save dashboard data and sent-alert log
        run: |
          git config user.name "home-watch-bot"
          git config user.email "home-watch-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date -u +%FT%TZ)"
          git pull --rebase --autostash -q && git push -q
